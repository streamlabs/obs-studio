name: Upload debug symbols
description: Indexes pdb's against their source and uploads them to the Streamlabs symbol server

inputs:
  githubWorkspace:
    description: "GitHub workspace path."
    required: true
  repoUserId:
    description: "Repository user ID."
    required: true
  repoName:
    description: "Repository name."
    required: true
  repoBranch:
    description: "Repository branch."
    required: true
  buildConfig:
    description: "Build configuration for Sentry upload (macOS only)."
    required: false
    default: "RelWithDebInfo"
  awsSymbAccessKeyId:
    description: "AWS Access Key ID used for symbol uploads."
    required: false
  awsSymbSecretAccessKey:
    description: "AWS Secret Access Key used for symbol uploads."
    required: false
  sentryAuthToken:
    description: "Auth token used for Sentry symbol uploads."
    required: false
  pdbPaths:
    description: "Comma separated folders to search for pdb's. Defaults to the whole workspace."
    required: false
    default: ""
  excludePdbNames:
    description: "Comma separated pdb file names or wildcard patterns to exclude."
    required: false
    default: ""
  binPaths:
    description: "Comma separated folders to search for exe/dll/node files; Sentry needs these to unwind x64 stacks. Empty uploads none."
    required: false
    default: ""
  excludeBinNames:
    description: "Comma separated binary file names or wildcard patterns to exclude."
    required: false
    default: ""
  forceUpload:
    description: "Upload every pdb instead of skipping the ones the symbol store already has."
    required: false
    default: "false"
  symsrvDebug:
    description: "Verbose symbol scripts and aws --debug."
    required: false
    default: "false"
  symsrvRef:
    description: "Ref of symsrv-scripts to run. Empty uses its default branch."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Fetch symsrv-scripts
      if: runner.os != 'macOS'
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 2
        repository: ${{ inputs.repoUserId }}/symsrv-scripts
        ref: ${{ inputs.symsrvRef }}
        path: symsrv-scripts

    - name: Run symbol server scripts
      if: runner.os != 'macOS'
      shell: powershell
      run: ./symsrv-scripts/main.bat "${{ inputs.githubWorkspace }}/symsrv-scripts" ".\main.ps1 -localSourceDir '${{ inputs.githubWorkspace }}' -repo_userId '${{ inputs.repoUserId }}' -repo_name '${{ inputs.repoName }}' -repo_branch '${{ inputs.repoBranch }}'${{ inputs.pdbPaths != '' && format(' -pdbPaths ''{0}''', inputs.pdbPaths) || '' }}${{ inputs.excludePdbNames != '' && format(' -excludePdbNames ''{0}''', inputs.excludePdbNames) || '' }}${{ inputs.binPaths != '' && format(' -binPaths ''{0}''', inputs.binPaths) || '' }}${{ inputs.excludeBinNames != '' && format(' -excludeBinNames ''{0}''', inputs.excludeBinNames) || '' }}${{ fromJSON(inputs.forceUpload) && ' -forceUpload' || '' }} -subModules 'plugins/mediasoup-connector,streamlabs,mediasoup-connector,streamlabs;plugins/enc-amf,streamlabs,obs-amd-encoder,streamlabs;plugins/motion-effect,streamlabs,motion-effect,master;plugins/obs-browser,streamlabs,obs-browser,streamlabs;plugins/obs-ndi,streamlabs,obs-ndi,streamlabs;plugins/obs-openvr,streamlabs,OBS-OpenVR-Input-Plugin,master;plugins/sl-vst,streamlabs,obs-vst,streamlabs;plugins/slobs-virtual-cam,streamlabs,slobs-virtual-cam,streamlabs;deps/libdshowcapture/src,streamlabs,libdshowcapture,streamlabs'"
      env:
        AWS_SYMB_ACCESS_KEY_ID: ${{ inputs.awsSymbAccessKeyId }}
        AWS_SYMB_SECRET_ACCESS_KEY: ${{ inputs.awsSymbSecretAccessKey }}
        SYMSRV_DEBUG: ${{ fromJSON(inputs.symsrvDebug) && '1' || '' }}

    - name: Upload debug files to Sentry (macOS only)
      if: runner.os == 'macOS'
      shell: bash
      run: python ./slobs_CI/sentry-osx.py
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.sentryAuthToken }}
        BUILDCONFIG: ${{ inputs.buildConfig }}
